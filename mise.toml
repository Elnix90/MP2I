[tools]
uv = "latest"
ruff = "latest"
pre-commit = "latest"
python = "3.14.7"

[env]
PYTHON_VERSION = "3.13"

[tasks.bot]
run = "uv run python3 -m main"
description = "Run bot from main.py"

[tasks.renderer]
run = "cargo build --release --manifest-path renderer/Cargo.toml"
description = "Build the mp2i-render LaTeX->PNG binary (release)"

[tasks.renderer-install]
run = """mkdir -p renderer/target/release \
&& curl -fsSL -o /tmp/mp2i-render.tar.gz https://github.com/Elnix90/MP2I/releases/latest/download/mp2i-render-linux-x86_64.tar.gz \
&& tar -xzf /tmp/mp2i-render.tar.gz -C renderer/target/release \
&& chmod +x renderer/target/release/mp2i-render"""
description = "Download the prebuilt mp2i-render binary from GitHub releases (no Rust needed)"

[tasks.venv]
run = "uv venv"
description = "Create virtual environment"

[tasks.install]
run = "uv sync"
description = "Install project dependencies"

[tasks.format]
run = "uv run ruff format && uv run ruff check --fix . && ./scripts/lint.sh"
description = "Format and fix imports using ruff"

[tasks.check]
run = "uv run ruff check . && uv run ruff format --check ."
description = "Check formatting and linting"

[tasks.setup-hooks]
run = "uv run pre-commit install"
description = "Install git hooks (pre-commit + commit-msg)"

[tasks.clean]
run = "source scripts/confirm.sh && confirm 'Supprimer logs/ et debug/ ?' && rm -rf logs debug && echo 'Nettoyé.' || echo 'Annulé.'"
description = "Clean up debug messages and logs"

[tasks.reset]
run = "source scripts/confirm.sh && confirm 'Supprimer .venv/, logs/, debug/, data/, __pycache__? Irréversible !' && rm -rf .venv logs debug data && find . -type d -name __pycache__ -not -path './.venv/*' -exec rm -rf {} + 2>/dev/null; echo 'Réinitialisé.' || echo 'Annulé.'"
description = "Reset project"

[tasks.reset-colloscope]
run = "uv run python3 -m db.generate_colloscope_db"
description = "Regenerate the colloscope database from the data we have"

[hooks]
postinstall = "mise reset-colloscope && mise setup-hooks && mise renderer-install"
