[tools]
uv = "latest"
ruff = "latest"
pre-commit = "latest"

[tasks.bot]
run = "python3 -m main"
description = "Run bot from main.py"

[tasks.venv]
run = "uv venv"
description = "Create virtual environment"

[tasks.lint]
run = "ruff check"
description = "Run linter"

[tasks.format]
run = "ruff format"
description = "Format using ruff"

[tasks.setup-hooks]
run = "pre-commit install && pre-commit install --hook-type commit-msg"
description = "Install git hooks (pre-commit + commit-msg)"
