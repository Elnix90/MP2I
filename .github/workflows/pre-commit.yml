name: Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: "3.13"

      - name: Install uv and project dependencies
        run: |
          python -m pip install --quiet uv
          uv sync --quiet

      - name: Install system tree
        run: sudo apt-get install -y tree
        # scripts/tree.py regenerates the README tree snapshot via `tree`

      - name: Run local lint
        run: bash scripts/lint.sh

      - name: Fail on drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Lint modified files. Run ./scripts/lint.sh locally and commit the changes."
            exit 1
          fi
